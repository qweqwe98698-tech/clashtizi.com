name: Auto SEO & GEO Matrix Publisher (Every 4 Days)

on:
  schedule:
    # 每 4 天上午 02:00 UTC (即北京时间上午 10:00) 定时全自动触发发布
    - cron: '0 2 */4 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '是否仅执行测试模式 (Dry Run: 不调用 DeepSeek API，不消耗 Token，不推送代码)'
        required: false
        type: boolean
        default: false
      slug:
        description: '指定生成特定文章 slug（留空则自动从选题矩阵轮巡）'
        required: false
        type: string
        default: ''
      silo:
        description: '指定专题分类目录 (tutorials / protocols / issues / recommend / security)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  publish-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run Auto SEO Publisher
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ inputs.slug }}" ]; then
            ARGS="$ARGS --slug=${{ inputs.slug }}"
          fi
          if [ -n "${{ inputs.silo }}" ]; then
            ARGS="$ARGS --silo=${{ inputs.silo }}"
          fi
          node scripts/auto-seo-publisher.mjs $ARGS

      - name: Commit and push changes to main
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/posts/ seo-system/
          if git diff --staged --quiet; then
            echo "没有检测到新增或更新的文章内容，跳过提交。"
          else
            # 注意：严禁添加 [skip ci]，确保每次自动发布推送到 main 后均能正常触发构建和 Vercel/Pages 部署
            git commit -m "feat(seo): 🤖 全自动发布万字级 SEO/GEO 深度主线矩阵专题文章"
            git push origin main
          fi

      - name: Build site
        if: ${{ inputs.dry_run != true }}
        run: pnpm run build

      - name: Deploy to pages branch
        if: ${{ inputs.dry_run != true }}
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: pages
          folder: dist
          clean: true
